[package]
name = "sprint"
version = "1.1.1"
description = "Sprint.exe: Scrum personal que funciona sin conexión"
authors = ["Zulema Gutiérrez"]
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# Abre la web de la autora en el navegador del sistema
open = "5"

# Programa pequeño y rápido: se optimiza el tamaño del ejecutable final
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
